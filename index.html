<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Sarapio - Airtel Pay</title>
<script src="https://checkout.flutterwave.com/v3.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#f0f9ff}
.head{background:#ff0000;color:white;padding:18px;text-align:center} /* Airtel Red */
.head img{width:85px;height:85px;border-radius:50%;border:3px solid white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:18px;padding:16px;text-align:center;box-shadow:0 4px 12px #0001;cursor:pointer}
.card:active{transform:scale(0.96)}
.card b{font-size:12px;display:block;margin:6px 0}
.paybtn{background:#ff0000;color:white;border:none;padding:8px 0;width:100%;border-radius:10px;font-weight:800;margin-top:8px}
</style>
</head>
<body>
<div class="head">
<img src="profile.jpg" onerror="this.src='https://via.placeholder.com/100'">
<h2>One Sarapio - Munteme</h2>
<small>Airtel Money: 0755555272</small><br>
<small>buganjaines@gmail.com</small><br>
<b>All Services UGX 5,000 - Direct Airtel PIN</b>
</div>
<div class="grid" id="grid"></div>

<script>
const MY_AIRTEL_NAME = "One Sarapio";
const PRICE = 5000;
// GET THIS FREE FROM flutterwave.com/ug Dashboard -> Settings -> API
const FLW_PUBLIC_KEY = "FLWPUBK-xxxxxxxxxxxxxxxxxxxxx-X"; // <-- CHANGE THIS

const services=[
["📘","Passport"],["🪪","National ID"],["📄","CV Making"],["🌍","Interpol"],
["📱","Phone Tracking"],["🏦","NSSF"],["🖨️","Printing"],["💰","Mobile Money"],
["🎓","Academic Docs"],["💼","Job Application"],["📑","Affidavit"],["✉️","Cover Letter"],
["🔄","Sim Replacement"],["🏧","URA TIN"],["📃","LC Letters"]
];

function payAirtel(service){
  let customerPhone = prompt(`Pay UGX ${PRICE} for ${service}?\n\nEnter YOUR Airtel number (07...):`);
  if(!customerPhone) return;
  customerPhone = customerPhone.replace(/\s/g,'');
  if(customerPhone.startsWith('0')) customerPhone = '256'+customerPhone.substring(1);
  
  FlutterwaveCheckout({
    public_key: FLW_PUBLIC_KEY,
    tx_ref: "SARAPIO-"+Date.now(),
    amount: PRICE,
    currency: "UGX",
    payment_options: "mobilemoneyuganda",
    customer: {
      email: "customer@onesarapio.com",
      phone_number: customerPhone,
      name: "Customer"
    },
    customizations: {
      title: MY_AIRTEL_NAME,
      description: service + " - Airtel 0755555272",
      logo: "https://buganjaines-lgtm.github.io/One-Sarapio-/icon-512.png"
    },
    callback: function(data){
      alert("Thank you! Payment received for "+service+". One Sarapio will contact you. Airtel Ref: "+data.transaction_id);
      window.location.href="https://wa.me/256755555272?text=Hello One Sarapio, I paid UGX 5000 for "+service;
    }
  });
}

document.getElementById('grid').innerHTML=services.map(s=>`
<div class="card" onclick="payAirtel('${s[1]}')">
<div style="font-size:32px">${s[0]}</div>
<b>${s[1]}</b>
<small>UGX ${PRICE.toLocaleString()}</small>
<button class="paybtn">PAY with Airtel PIN</button>
</div>
`).join('');
</script>
</body>
</html>
